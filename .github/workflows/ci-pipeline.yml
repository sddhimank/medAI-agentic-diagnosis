name: MedAI Agentic Analytics CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-sanity-test:
    runs-on: ubuntu-latest
    steps:
    - name: 🔍 Checkout Repository Code
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Compile Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🎨 Code Linting Syntax Analysis
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build-test:
    runs-on: ubuntu-latest
    needs: code-sanity-test
    steps:
    - name: 🔍 Checkout Repository Code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Docker Buildx Cores
      uses: docker/setup-buildx-action@v3

    - name: 🚀 Validate Backend Service Compilation (FastAPI)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.api
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
