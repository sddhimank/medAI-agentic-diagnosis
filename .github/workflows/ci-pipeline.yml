name: MedAI Agentic Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-sanity-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: 🔍 Checkout Repository Code
      uses: actions/checkout@v4

    - name: 🐍 Initialize Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Compile Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 wheel pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🎨 Code Linting Syntax Analysis
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 🧪 Execute Automated Unit Test Framework Cases
      run: |
        export PYTHONPATH=$GITHUB_WORKSPACE
        pytest -v tests/

  docker-build-test:
    runs-on: ubuntu-latest
    needs: code-sanity-and-test
    steps:
    - name: 🔍 Checkout Repository Code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Docker Buildx Cores
      uses: docker/setup-buildx-action@v3

    - name: 🚀 Validate Backend Service Compilation (FastAPI)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.api
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  continuous-deployment:
    runs-on: ubuntu-latest
    # Enforces strict dependency mapping rules so CD runs ONLY on successful build passes
    needs: [code-sanity-and-test, docker-build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📡 Establish SSH Handshake and Remote Deploy to Azure VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_VM_IP }}
        username: ${{ secrets.AZURE_VM_USER }}
        key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true # Fails the workflow instantly if any shell command errors out
        script: |
          echo "[CD WORKER] Accessing production repository layout context..."
          cd /home/azureuser/medical-imaging-agent
          
          echo "[CD WORKER] Pulling verified delta commits straight from GitHub main branch..."
          git fetch origin main
          git reset --hard origin/main
          
          echo "[CD WORKER] Wiping out dangling python bytecode track caches..."
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          
          echo "[CD WORKER] Hot-reloading container clusters sequentially..."
          # Restart the UI portal and agent microservice layers seamlessly without dropping data storage boundaries
          docker-compose restart streamlit-ui agent-api
          
          echo "✓ [CD PIPELINE SUCCESS] Code synchronized and microservices hot-reloaded on Azure instance."
